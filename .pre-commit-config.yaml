repos:
  - repo: local
    hooks:
      - id: log-anomaly-analysis-tests
        name: log-anomaly-analysis tests
        entry: bash -c "cd log-anomaly-analysis && poetry run pytest"
        language: system
        files: ^log-anomaly-analysis/
        pass_filenames: false
      - id: drain3-service-tests
        name: drain3-service tests
        entry: bash -c "cd services/drain3-service && if ls test_*.py tests/ 2>/dev/null; then poetry run pytest; else echo 'No tests found, skipping'; fi"
        language: system
        files: ^services/drain3-service/
        pass_filenames: false
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict