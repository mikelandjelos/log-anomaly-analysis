dataset:
  type: "file"
  path: "../../data/raw/labeled/BGL/BGL.log"
  format: "raw"

preprocessing:
  log_pattern: '^(?P<Label>\S+)\s+(?P<Epoch>\d+)\s+(?P<Date>\d{4}\.\d{2}\.\d{2})\s+(?P<Node>\S+)\s+(?P<Timestamp>\d{4}-\d{2}-\d{2}-\d{2}\.\d{2}\.\d{2}\.\d{6})\s+(?P<Source>\S+)\s+(?P<Subsystem>\S+)\s+(?P<LogLevel>\S+)\s+(?P<Content>.+)$'
  timestamp_format: "%Y-%m-%d-%H.%M.%S.%f"
  strict_mode: true
  require_timestamps: true

parsing:
  similarity_threshold: 0.5
  depth: 4
  max_children: 150
  max_clusters: 2048
  extra_delimiters: ["_", "-", ".", ":", "/"]
  masking_rules:
    - regex_pattern: r"core\.\d+"
      mask_with: "CORE"
  mask_prefix: "<:"
  mask_suffix: ":>"

windowing:
  strategy: "fixed"
  window_size: "10m"

anomaly_detection:
  algorithm: "pca_subspace"
  variance_threshold: 0.95
  alpha: 0.001
  use_tfidf: false
  use_scaling: true

output:
  directory: "../../data/results/labeled/BGL"
  save_intermediate: true
  formats: ["parquet"]
