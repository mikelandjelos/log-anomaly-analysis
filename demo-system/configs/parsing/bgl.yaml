preprocessing:
  log_pattern: '^(?P<Label>\S+)\s+(?P<Epoch>\d+)\s+(?P<Date>\d{4}\.\d{2}\.\d{2})\s+(?P<Node>\S+)\s+(?P<Timestamp>\d{4}-\d{2}-\d{2}-\d{2}\.\d{2}\.\d{2}\.\d{6})\s+(?P<Source>\S+)\s+(?P<Subsystem>\S+)\s+(?P<LogLevel>\S+)\s+(?P<Content>.+)$'
  timestamp_format: "%Y-%m-%d-%H.%M.%S.%f"
  strict_mode: true
  require_timestamps: true

parsing:
  similarity_threshold: 0.4
  depth: 4
  max_children: 100
  max_clusters: 2048
  extra_delimiters: ["_", ":", "/", "-"]
  masking_rules:
    - regex_pattern: '(\d+)'
      mask_with: "NUM"
    - regex_pattern: '([A-Fa-f0-9]{8,})'
      mask_with: "HEX"
  mask_prefix: "<:"
  mask_suffix: ":>"
