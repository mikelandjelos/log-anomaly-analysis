preprocessing:
  log_pattern: '^\-\s+(?P<Epoch>\d+)\s+(?P<JulianDate>\d{4}\.\d{2}\.\d{2})\s+(?P<Node>\S+)\s+(?P<Timestamp>[A-Za-z]{3}\s+\d{2}\s+\d{2}:\d{2}:\d{2})\s+(?P<Content>.+)$'
  timestamp_format: "%b %d %H:%M:%S"
  strict_mode: false
  require_timestamps: true

parsing:
  similarity_threshold: 0.45
  depth: 4
  max_children: 100
  max_clusters: 1024
  extra_delimiters: ["_", ".", "-", ":", "/", "@"]
  masking_rules:
    - regex_pattern: '(\d+\.\d+\.\d+\.\d+)'
      mask_with: "IP"
    - regex_pattern: '(\d+)'
      mask_with: "NUM"
  mask_prefix: "<:"
  mask_suffix: ":>"
