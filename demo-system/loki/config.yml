auth_enabled: false

common:
  path_prefix: /loki
  replication_factor: 1

ingester:
  lifecycler:
    address: 127.0.0.1
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
  chunk_idle_period: 5m
  chunk_retain_period: 30s

server:
  http_listen_port: 3100

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/index
    cache_location: /loki/index-cache
  filesystem:
    directory: /loki/storage

compactor:
  working_directory: /loki/compactor

limits_config:
  ingestion_rate_mb: 1024
  ingestion_burst_size_mb: 1024

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
