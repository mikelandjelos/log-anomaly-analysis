services:
  loki:
    container_name: loki
    image: grafana/loki:3.0.0
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./loki/config.yml:/etc/loki/local-config.yaml:ro
    ports:
      - "3100:3100"

  grafana:
    container_name: grafana
    image: grafana/grafana:11.1.0
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards/files:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - loki

  drain3:
    container_name: parser
    build:
      context: ..
      dockerfile: services/drain3-service/Dockerfile
    volumes:
      - ./configs/parsing:/configs:ro
    environment:
      - LOGURU_LEVEL=INFO
      - LOKI_URL=http://loki:3100/loki/api/v1/push
    ports:
      - "8000:8000"

  logstash:
    container_name: logstash
    image: docker.elastic.co/logstash/logstash:8.15.3
    volumes:
      - ./logstash/pipelines:/usr/share/logstash/pipeline:ro
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
    depends_on:
      - drain3
    ports:
      - "5044:5044"
    command: ["-f", "/usr/share/logstash/pipeline"]
