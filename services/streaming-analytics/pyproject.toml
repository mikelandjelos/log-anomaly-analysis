[project]
name = "streaming-analytics-service"
version = "0.1.0"
description = "Loki tail -> Accumulator -> Streaming PCA scorer"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.24",
  "httpx>=0.27",
  "websockets>=12.0",
  "polars>=1.33",
  "pydantic>=2.8",
  "loguru>=0.7",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

