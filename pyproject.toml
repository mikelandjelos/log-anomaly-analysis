[project]
name = "log-anomaly-analysis"
version = "0.1.0"
description = "Pipeline exploration for log anomaly detection"
authors = [{ name = "Mihajlo Madic", email = "mihajlo.madic@gmail.com" }]
readme = "README.md"
requires-python = "^3.11"
dependencies = [
    "polars (>=1.33.1,<2.0.0)",
    "numpy (>=2.3.3,<3.0.0)",
    "scikit-learn (>=1.7.2,<2.0.0)",
    "scipy (>=1.16.2,<2.0.0)",
    "drain3 (>=0.9.11,<0.10.0)",
    "pyyaml (>=6.0.2,<7.0.0)",
    "click (>=8.2.1,<9.0.0)",
    "rich (>=14.1.0,<15.0.0)",
    "loguru (>=0.7.3,<0.8.0)",
]
license = "MIT"
keywords = ["log-analysis", "anomaly-detection", "drain3", "pca"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: System :: Logging",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.2"
pytest-cov = "^7.0.0"
black = "^25.1.0"
isort = "^6.0.1"
flake8 = "^7.3.0"
mypy = "^1.18.1"
pre-commit = "^4.3.0"
jupyter = "^1.1.1"


[tool.poetry.group.visualization.dependencies]
matplotlib = "^3.10.6"
seaborn = "^0.13.2"
plotly = "^6.3.0"
pandas = "^2.3.2"
pyarrow = "^21.0.0"


[tool.poetry.group.docs.dependencies]
mkdocs = "^1.6.1"
mkdocs-material = "^9.6.19"
mkdocstrings = "^0.30.0"

[tool.poetry.scripts]
log-anomaly = "log_anomaly_analysis.cli:main"
log-anomaly-visualize = "log_anomaly_analysis.visualization.dashboard:main"

[tool.black]
line-length = 88
target-version = ['py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["log_anomaly_analysis"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --cov=log_anomaly_analysis --cov-report=term-missing"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]
